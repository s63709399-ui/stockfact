services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockfact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockfact}
      POSTGRES_DB: stockfact
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockfact -d stockfact"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: postgresql://stockfact:${POSTGRES_PASSWORD:-stockfact}@db:5432/stockfact
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SCAN_PROVIDER: ${SCAN_PROVIDER:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
